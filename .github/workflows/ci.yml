name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.stylelintrc.json'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.stylelintrc.json'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/tsc/tsbuildinfo
          key: tsc-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ hashFiles('src/**', 'vite.config.ts', 'worker-configuration.d.ts') }}
          restore-keys: |
            tsc-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Lint & Format Check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  preview:
    name: Deploy & Comment Preview URL
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Preview
        id: preview
        run: |
          set -o pipefail
          output="$(npx wrangler preview --name "pr-${PR_NUMBER}" --json)"
          printf '%s\n' "$output"
          json="$(printf '%s\n' "$output" | sed -n '/^{/,$p')"
          preview_url="$(printf '%s' "$json" | jq -er '.preview.urls[0]')"
          deployment_url="$(printf '%s' "$json" | jq -er '.deployment.urls[0]')"
          {
            echo "preview_url=$preview_url"
            echo "deployment_url=$deployment_url"
          } >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment Preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment_url }}
        with:
          script: |
            const marker = "<!-- pr-preview -->";
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `Preview URL: ${process.env.PREVIEW_URL}`,
              `Deployment URL: ${process.env.DEPLOYMENT_URL}`,
              `Commit: \`${sha}\``,
            ].join("\n");
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
            });
            const existing = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
