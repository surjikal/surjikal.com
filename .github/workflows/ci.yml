name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache build tooling
        uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: build-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'vite.config.ts') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'vite.config.ts') }}-

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Lint & Format Check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
