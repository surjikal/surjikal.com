name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.stylelintrc.json'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.stylelintrc.json'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/tsc/tsbuildinfo
          key: tsc-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ hashFiles('src/**', 'vite.config.ts', 'worker-configuration.d.ts') }}
          restore-keys: |
            tsc-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Lint & Format Check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
